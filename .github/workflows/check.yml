name: Workbench check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter dsh-personal-workbench check
      - run: pnpm --filter dsh-personal-workbench test
      - run: pnpm --filter dsh-personal-workbench build
      - run: node --check plugins/personal-workbench/dist/client.js
      - run: pnpm --filter dsh-personal-workbench pack --pack-destination "${{ github.workspace }}/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}
          path: artifacts/*.tgz
          if-no-files-found: error
