name: Workbench check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node --check dist/client.js
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install chromium --with-deps
      - if: runner.os == 'Linux'
        run: pnpm test:browser
      - run: pnpm pack --pack-destination "${{ github.workspace }}/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}
          path: artifacts/*.tgz
          if-no-files-found: error
